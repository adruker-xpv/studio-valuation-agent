    description: Onboard a portfolio company from the workbooks supplied for one quarter - the company valuation workbook, the fund valuation workbook, and any upstream files (company monthly financials or management accounts, XPV monthly summaries, TTM or pro forma workbooks). Maps how the value reported to the fund is built and where its inputs come from, in short checkpointed stages that always leave a usable extraction.json, then proposes structured changes for next quarter for a person to approve in Excel. Use whenever a message says ONBOARDING EXTRACTION, ONBOARDING RESUME, ONBOARDING REVIEW or ONBOARDING RESPONSE, or asks to onboard, extract from, trace or map valuation workbooks - including continuing after a timeout. Reads only; never changes a workbook. Messages give Company and Period (and the Run folder when resuming or reviewing).
