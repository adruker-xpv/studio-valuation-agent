connectorDefinitions:
  - kind: ConnectorDefinition
    connectorId: /providers/Microsoft.PowerApps/apis/shared_sharepointonline
    version: 639240805011254400
    displayName: SharePoint
    description: SharePoint helps organizations share and collaborate with colleagues, partners, and customers. You can connect to SharePoint Online or to an on-premises SharePoint 2016 or 2019 farm using the On-Premises Data Gateway to manage documents and list items.
    connectorType: Public
    iconUri: https://static.powerapps.com/resource/ppcr/releases/v1.0.1827/1.0.1827.4913/sharepointonline/icon.png
    changedTime: 2026-09-04T01:01:41.1254441Z
    hasPublicData: false
    isSSOSupported: true
    operations:
      - kind: ConnectorOperation
        displayName: Agreements Solution - Generate document within Agreements Solution workspace
        description: Use this action to create documents based on modern templates in a Agreements Solution workspace. This is behind a payment wall currently in planning (either license or PayG).
        nameForModel: create_agreements_solution_document
        descriptionForModel: "Use this tool to create, generate, or produce a new document inside a Microsoft SharePoint Agreements Solution workspace from a modern template. Requires an Agreements Solution license (license or pay-as-you-go). Sample intents: 'Generate a new NDA document in the Legal Agreements workspace'; 'Create a vendor contract from the standard template'."
        inputType:
          kind: Record
          properties:
            dataset:
              kind: PropertyInfo
              displayName: Agreements Solution Workspace
              description: "Example: https://contoso.sharepoint.com/sites/sitename."
              nameForModel: create_agreements_solution_document_dataset
              descriptionForModel: "Set to the full HTTPS URL of the SharePoint site that contains the target list, library, file, or folder. Do not include any list or library path. Example: https://contoso.sharepoint.com/sites/PMO."
              isRequired: true
              order: 0
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            documentName:
              kind: PropertyInfo
              displayName: File Name
              description: Document file name.
              nameForModel: create_agreements_solution_document_document_name
              descriptionForModel: "Set to the file name (without path) for the new generated document. Example: NDA-Contoso-2026.docx."
              order: 3
              type:
                kind: String
            item:
              kind: PropertyInfo
              displayName: Fields
              description: Document placeholder values.
              isRequired: true
              order: 2
              type:
                kind: UnresolvedDynamicType
            template:
              kind: PropertyInfo
              displayName: Agreements Solution Template
              description: Agreements Solution template.
              nameForModel: create_agreements_solution_document_template
              descriptionForModel: Set to the modern template identifier inside the Agreements Solution workspace to use as the basis for the new document. Source from the list of available templates in the workspace.
              isRequired: true
              order: 1
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
        outputType:
          kind: Record
          properties:
            DisplayName:
              kind: PropertyInfo
              description: The display name of the file or folder.
              order: 3
              type:
                kind: String
            ETag:
              kind: PropertyInfo
              description: The etag of the file or folder.
              order: 9
              type:
                kind: String
            FileLocator:
              kind: PropertyInfo
              description: The filelocator of the file or folder.
              order: 10
              type:
                kind: String
            Id:
              kind: PropertyInfo
              description: The unique id of the file or folder.
              order: 1
              type:
                kind: String
            IsFolder:
              kind: PropertyInfo
              description: A boolean value (true, false) to indicate whether or not the blob is a folder.
              order: 8
              type:
                kind: Boolean
            ItemId:
              kind: PropertyInfo
              description: The value that can be used to Get or Update file properties in libraries.
              order: 0
              type:
                kind: Number
            LastModified:
              kind: PropertyInfo
              description: The date and time the file or folder was last modified.
              order: 5
              type:
                kind: DateTime
            MediaType:
              kind: PropertyInfo
              description: The media type of the file or folder.
              order: 7
              type:
                kind: String
            Name:
              kind: PropertyInfo
              description: The name of the file or folder.
              order: 2
              type:
                kind: String
            Path:
              kind: PropertyInfo
              description: The path of the file or folder.
              order: 4
              type:
                kind: String
            Size:
              kind: PropertyInfo
              description: The size of the file or folder.
              order: 6
              type:
                kind: Number
        operationId: CreateAgreementsSolutionDocument
      - kind: ConnectorOperation
        displayName: Get all lists and libraries
        description: Get all lists and libraries.
        nameForModel: get_all_tables
        inputType:
          kind: Record
          properties:
            dataset:
              kind: PropertyInfo
              displayName: Site Address
              description: "Example: https://contoso.sharepoint.com/sites/sitename."
              nameForModel: get_all_tables_dataset
              descriptionForModel: "Set to the full HTTPS URL of the SharePoint site that contains the target list, library, file, or folder. Do not include any list or library path. Example: https://contoso.sharepoint.com/sites/PMO."
              isRequired: true
              order: 0
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
              aiSensitivity: High
        outputType:
          kind: Record
          properties:
            value:
              kind: PropertyInfo
              description: List of Tables
              order: 0
              type:
                kind: Table
                properties:
                  DisplayName:
                    kind: PropertyInfo
                    description: The display name of the table.
                    order: 1
                    type:
                      kind: String
                  DynamicProperties:
                    kind: PropertyInfo
                    description: Additional table properties provided by the connector to the clients.
                    order: 2
                    type:
                      kind: Any
                  Name:
                    kind: PropertyInfo
                    description: The name of the table. The name is used at runtime.
                    order: 0
                    type:
                      kind: String
        operationId: GetAllTables
      - kind: ConnectorOperation
        displayName: Approve hub site join request
        description: Approve hub site join request. This will return an approval token that can be used to complete the join request using the join hub site action.
        nameForModel: approve_hub_site_join
        inputType:
          kind: Record
          properties:
            dataset:
              kind: PropertyInfo
              displayName: Hub Site Address
              description: "Example: https://contoso.sharepoint.com/sites/sitename."
              nameForModel: approve_hub_site_join_dataset
              descriptionForModel: "Set to the full HTTPS URL of the SharePoint site that contains the target list, library, file, or folder. Do not include any list or library path. Example: https://contoso.sharepoint.com/sites/PMO."
              isRequired: true
              order: 0
              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            joiningSiteId:
              kind: PropertyInfo
              displayName: Requesting Site Id
