        descriptionForModel: "Use this tool to send, invoke, or call an arbitrary SharePoint REST API endpoint with a chosen HTTP method, headers and body. Use this only as a last resort when no purpose-built SharePoint action covers the user's intent, since it can perform any operation the caller is authorized for. Sample intent: 'Call the SharePoint REST API to fetch site users'."
