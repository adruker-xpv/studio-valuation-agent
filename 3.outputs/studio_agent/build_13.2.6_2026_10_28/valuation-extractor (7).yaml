              kind: PropertyInfo
              displayName: Site Address
              description: "Example: https://contoso.sharepoint.com/sites/sitename."
              nameForModel: http_request_dataset
              descriptionForModel: "Set to the full HTTPS URL of the SharePoint site that contains the target list, library, file, or folder. Do not include any list or library path. Example: https://contoso.sharepoint.com/sites/PMO."
