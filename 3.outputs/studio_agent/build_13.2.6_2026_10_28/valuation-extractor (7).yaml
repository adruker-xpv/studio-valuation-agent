              dynamicValuesConfig:
                kind: ConnectorDynamicValuesConfig
                capability: List
              type:
                kind: String
            headers:
              kind: PropertyInfo
              displayName: Headers
              description: Enter JSON object of request headers
              order: 3
              type:
                kind: Any
            method:
              kind: PropertyInfo
              displayName: Method
              description: Http Method
              isRequired: true
              order: 1
              enumValues:
                - GET
                - PUT
                - POST
                - PATCH
                - DELETE
              type:
